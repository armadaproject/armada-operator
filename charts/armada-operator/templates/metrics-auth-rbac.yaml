apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "armada-operator.fullname" . }}-metrics-auth-role
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/created-by: armada-operator
    app.kubernetes.io/part-of: armada-operator
  {{- include "armada-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "armada-operator.fullname" . }}-metrics-auth-rolebinding
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/created-by: armada-operator
    app.kubernetes.io/part-of: armada-operator
  {{- include "armada-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "armada-operator.fullname" . }}-metrics-auth-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "armada-operator.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
